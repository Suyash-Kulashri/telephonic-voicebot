version: "3.9"
services:
  livekit:
    image: livekit/livekit-server:latest
    command: --config /etc/livekit.yaml
    ports:
      - "7880:7880"       # HTTP/WS signaling
      - "7881:7881"       # RTC TCP
      - "50000-50100:50000-50100/udp"  # RTC media
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml